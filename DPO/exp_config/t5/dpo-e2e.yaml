exp_name: t5
dataset: e2e
llm_name: Qwen2.5-1.5B-Instruct
trainer:
  run_name: 'dpo-1'
  output_dir: out/DPO
  overwrite_output_dir: true
  bf16: true
  tf32: true
  report_to: 'wandb'
  seed: 42
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  per_device_eval_batch_size: 1
  max_steps: 10000
  optim: 'adamw_torch'
  weight_decay: 0.01
  lr_scheduler_type: 'cosine_with_min_lr'
  learning_rate: 7e-7
  lr_scheduler_kwargs:
    min_lr_rate: 0.1
  warmup_ratio: 0.1
  save_strategy: 'steps'
  ddp_find_unused_parameters: false
  dataloader_num_workers: 12
  beta: 0.1
  max_prompt_length: 2200
  max_target_length: 150
  max_length: 2350
  # eval_strategy: 'steps'
  eval_steps: 100
  save_steps: 100
  save_safetensors: False
  logging_steps: 10
  remove_unused_columns: False

model:
  sft_run_name: sft-0
  model_path: out/SFT-${dataset}-${llm_name}

data:
  data_dir: dataset/w2s/${llm_name}/${dataset}
  data_path: ''
  train_data_path: ''
  dev_data_path: ''
  test_data_path: ''
  tokenizer_path: t5-base
  model_max_length: 270
  max_src_len: 70
  max_tgt_len: 200

eval:
  per_device_eval_batch_size: 24
  max_new_tokens: 270
  use_calc: true
  mode: 'greedy'
  sampling:
    temperature: 0.7
    min_seed: 0
    max_seed: 10
